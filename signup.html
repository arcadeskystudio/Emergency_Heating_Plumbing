<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Callout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/auth.js"></script>
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="dot"></span>Callout</a>
    <div class="navlinks"><a href="how-it-works.html">How it works</a><a href="login.html">Log in</a></div>
    <div class="navcta"><a href="request-service.html" class="btn btn-primary btn-sm">Get help now</a></div>
  </div>
</nav>

<div class="auth-wrap">
  <h1 style="font-size:26px;text-align:center;">Create your account</h1>
  <p style="text-align:center;margin-bottom:24px;">Are you signing up for help, or to receive callouts?</p>

  <div id="authErr" class="hidden" style="background:rgba(208,57,43,.1);color:var(--urgent);padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px;"></div>

  <div class="role-toggle">
    <button id="roleCustomerBtn" class="active" onclick="setRole('customer')">I need a tradesperson</button>
    <button id="roleTradeBtn" onclick="setRole('trade')">I'm a tradesperson</button>
  </div>

  <!-- CUSTOMER FORM -->
  <form id="customerForm" onsubmit="return handleSignup(event,'customer')">
    <div class="field"><label>Full name</label><input id="c_name" type="text" required placeholder="e.g. Jamie Reid"></div>
    <div class="field"><label>Email</label><input id="c_email" type="email" required placeholder="you@email.com"></div>
    <div class="field"><label>Phone number</label><input id="c_phone" type="tel" required placeholder="07…"></div>
    <div class="field"><label>Postcode</label><input id="c_postcode" type="text" required placeholder="e.g. KY11 4AB"></div>
    <div class="field">
      <label>Property type</label>
      <select id="c_property">
        <option value="">Select property type…</option>
        <option>House</option>
        <option>Flat / apartment</option>
        <option>Rented property</option>
        <option>Commercial premises</option>
      </select>
    </div>
    <div class="field"><label>Password</label><input id="c_password" type="password" required minlength="6" placeholder="At least 6 characters"></div>
    <button type="submit" class="btn btn-primary btn-block" id="c_submitBtn">Create account</button>
  </form>

  <!-- TRADESPERSON FORM -->
  <form id="tradeForm" class="hidden" onsubmit="return handleSignup(event,'trade')">
    <div class="field"><label>Business name</label><input id="t_business" type="text" required placeholder="e.g. Reid Heating & Plumbing"></div>
    <div class="field"><label>Contact name</label><input id="t_name" type="text" required placeholder="e.g. Jamie Reid"></div>
    <div class="field"><label>Email</label><input id="t_email" type="email" required placeholder="you@business.co.uk"></div>
    <div class="field"><label>Phone number</label><input id="t_phone" type="tel" required placeholder="07…"></div>

    <div class="two-col">
      <div class="field">
        <label>Primary trade</label>
        <select id="t_primary">
          <option value="">Select…</option>
          <option>Heating engineer</option>
          <option>Plumber</option>
          <option>Both</option>
        </select>
      </div>
      <div class="field">
        <label>Years in business</label>
        <select id="t_years">
          <option value="">Select…</option>
          <option>Less than 1 year</option>
          <option>1–3 years</option>
          <option>4–9 years</option>
          <option>10+ years</option>
        </select>
      </div>
    </div>

    <div class="field"><label>Postcode areas you cover (comma separated)</label><input id="t_coverage" type="text" required placeholder="e.g. KY11, KY12, KY1"></div>
    <div class="field"><label>Gas Safe / certification number</label><input id="t_gassafe" type="text" placeholder="e.g. GS-123456 (heating only)"></div>
    <div class="field"><label>Password</label><input id="t_password" type="password" required minlength="6" placeholder="At least 6 characters"></div>
    <button type="submit" class="btn btn-water btn-block" id="t_submitBtn">Create tradesperson account</button>
  </form>

  <p style="text-align:center;margin-top:18px;font-size:13.5px;">Already have an account? <a href="login.html" style="color:var(--flame);">Log in</a></p>
</div>

<script src="assets/script.js"></script>
<script>
function setRole(role){
  document.getElementById('roleCustomerBtn').classList.toggle('active', role==='customer');
  document.getElementById('roleTradeBtn').classList.toggle('active', role==='trade');
  document.getElementById('customerForm').classList.toggle('hidden', role!=='customer');
  document.getElementById('tradeForm').classList.toggle('hidden', role!=='trade');
}

async function handleSignup(e, role){
  e.preventDefault();
  document.getElementById('authErr').classList.add('hidden');
  const btn = document.getElementById(role==='trade' ? 't_submitBtn' : 'c_submitBtn');
  btn.disabled = true;
  btn.textContent = 'Creating account…';

  const email = document.getElementById(role==='trade' ? 't_email' : 'c_email').value;
  const password = document.getElementById(role==='trade' ? 't_password' : 'c_password').value;

  const { data, error } = await supabaseClient.auth.signUp({ email, password });

  if(error){
    document.getElementById('authErr').textContent = error.message;
    document.getElementById('authErr').classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = role==='trade' ? 'Create tradesperson account' : 'Create account';
    return false;
  }

  const userId = data.user.id;
  let profile;
  if(role === 'customer'){
    profile = {
      id: userId, role: 'customer',
      full_name: document.getElementById('c_name').value,
      phone: document.getElementById('c_phone').value,
      postcode: document.getElementById('c_postcode').value,
      property_type: document.getElementById('c_property').value
    };
  } else {
    profile = {
      id: userId, role: 'trade',
      full_name: document.getElementById('t_name').value,
      phone: document.getElementById('t_phone').value,
      business_name: document.getElementById('t_business').value,
      primary_trade: document.getElementById('t_primary').value,
      years_experience: document.getElementById('t_years').value,
      coverage_postcodes: document.getElementById('t_coverage').value,
      gas_safe_number: document.getElementById('t_gassafe').value
    };
  }

  const { error: profErr } = await supabaseClient.from('profiles').insert(profile);
  if(profErr){
    document.getElementById('authErr').textContent = 'Account created, but saving your details failed: ' + profErr.message;
    document.getElementById('authErr').classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = role==='trade' ? 'Create tradesperson account' : 'Create account';
    return false;
  }

  window.location.href = role==='trade' ? 'plumber-dashboard.html' : 'customer-dashboard.html';
  return false;
}

// preselect role from ?role=plumber in URL
const params = new URLSearchParams(window.location.search);
if(params.get('role')==='plumber'){ setRole('trade'); }
</script>
</body>
</html>
