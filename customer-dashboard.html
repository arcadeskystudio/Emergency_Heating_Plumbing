<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My callouts — Callout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/auth.js"></script>
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="dot"></span>Callout</a>
    <div class="navlinks"><span class="mono" id="whoami" style="color:var(--muted);">…</span></div>
    <div class="navcta"><a href="#" onclick="logout()" class="btn btn-ghost btn-sm">Log out</a></div>
  </div>
</nav>

<div class="dash-shell">
  <aside class="sidebar">
    <a href="#" class="active">My callouts</a>
    <a href="request-service.html">+ New callout</a>
    <a href="profile.html">My profile</a>
  </aside>

  <main class="dash-main">
    <h2 style="margin-bottom:20px;">Your callouts</h2>
    <div id="calloutList"><p>Loading…</p></div>
  </main>
</div>

<script>
let currentUser = null;
let myCallouts = [];
let pendingRating = {}; // calloutId -> chosen stars

(async function init(){
  const auth = await requireAuth();
  if(!auth) return;
  currentUser = auth.session.user;
  document.getElementById('whoami').textContent = auth.profile ? auth.profile.full_name : currentUser.email;
  await loadCallouts();
})();

function photosOf(c){
  let arr = Array.isArray(c.photo_urls) ? c.photo_urls : [];
  if(arr.length === 0 && c.photo_url) arr = [c.photo_url];
  return arr;
}

function statusSteps(status){
  const steps = [
    { key:'submitted', label:'Callout received' },
    { key:'accepted', label:'Matched with an engineer' },
    { key:'trade_completed', label:'Engineer marked complete' },
    { key:'completed', label:'You confirmed — job done' }
  ];
  const order = ['submitted','accepted','trade_completed','completed'];
  const currentIdx = order.indexOf(status);
  return steps.map((s,i) => {
    let cls = '';
    if(i < currentIdx) cls = 'done';
    else if(i === currentIdx) cls = status === 'completed' ? 'done' : 'current';
    return `<li class="${cls}"><div class="tl-dot"></div><div><div class="tl-title">${s.label}</div></div></li>`;
  }).join('');
}

async function loadCallouts(){
  const { data, error } = await supabaseClient
    .from('callouts')
    .select('*')
    .eq('customer_id', currentUser.id)
    .order('created_at', { ascending: false });

  const listEl = document.getElementById('calloutList');
  if(error){ listEl.innerHTML = `<p>Couldn't load your callouts: ${error.message}</p>`; return; }
  myCallouts = data || [];

  if(myCallouts.length === 0){
    listEl.innerHTML = `<div class="panel" style="text-align:center;"><p>No callouts yet.</p><a href="request-service.html" class="btn btn-primary">Submit your first callout</a></div>`;
    return;
  }

  listEl.innerHTML = myCallouts.map(c => {
    const photos = photosOf(c);
    let confirmBlock = '';

    if(c.status === 'trade_completed'){
      const stars = pendingRating[c.id] || 0;
      confirmBlock = `
        <div class="panel panel-tight" style="margin-top:16px;background:var(--flame-dim);border-color:rgba(242,121,60,.3);">
          <h4 style="margin-bottom:6px;">${c.assigned_trade_name || 'Your engineer'} says this job is complete</h4>
          <p style="margin-bottom:12px;">Confirm it's done, and rate your experience:</p>
          <div class="stars" id="stars-${c.id}">
            ${[1,2,3,4,5].map(n => `<span class="${n<=stars?'lit':''}" onclick="setStars('${c.id}',${n})">★</span>`).join('')}
          </div>
          <textarea id="review-${c.id}" placeholder="Optional: a short review of the work…" style="width:100%;margin-top:12px;padding:10px;border-radius:10px;border:1px solid var(--line);font-family:'Inter';font-size:13.5px;min-height:60px;"></textarea>
          <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="confirmComplete('${c.id}')">Confirm job complete</button>
        </div>`;
    } else if(c.status === 'completed'){
      confirmBlock = `
        <div class="lead-meta" style="margin-top:12px;">
          ✅ Completed${c.rating ? ` · You rated ${'★'.repeat(c.rating)}` : ''}
          ${c.review ? `<br><em>"${c.review}"</em>` : ''}
        </div>`;
    }

    return `
    <div class="panel" style="margin-bottom:20px;">
      <div class="lead-top">
        <div>
          <span class="badge ${c.service==='heat'?'badge-heat':'badge-water'}">${c.issue || c.service}</span>
          ${c.urgency==='Emergency — right now' ? '<span class="badge badge-urgent" style="margin-left:6px;">Emergency</span>' : ''}
          <p style="margin:10px 0 0;color:var(--text);">${c.description || ''}</p>
        </div>
      </div>
      <div class="lead-meta" style="margin-top:12px;">Ref #${c.id.slice(0,8).toUpperCase()} · ${c.address || ''}</div>
      ${photos.length ? `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">${photos.map(u=>`<div class="thumb-sm"><img class="img-cover" src="${u}"></div>`).join('')}</div>` : ''}
      <h4 style="margin:20px 0 14px;font-size:15px;">Status</h4>
      <ul class="timeline">${statusSteps(c.status)}</ul>
      ${c.assigned_trade_name && c.status !== 'submitted' ? `<div class="lead-meta">Engineer: <strong style="color:var(--text);">${c.assigned_trade_name}</strong></div>` : ''}
      ${confirmBlock}
    </div>`;
  }).join('');
}

function setStars(id, n){
  pendingRating[id] = n;
  const el = document.getElementById('stars-'+id);
  Array.from(el.children).forEach((s,i)=> s.classList.toggle('lit', i < n));
}

async function confirmComplete(id){
  const rating = pendingRating[id] || null;
  const review = document.getElementById('review-'+id).value.trim() || null;
  const { error } = await supabaseClient
    .from('callouts')
    .update({ status: 'completed', rating, review })
    .eq('id', id)
    .eq('customer_id', currentUser.id)
    .eq('status', 'trade_completed');
  if(error){ alert('Could not confirm: ' + error.message); return; }
  await loadCallouts();
}
</script>
</body>
</html>
